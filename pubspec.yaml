name: nextpos
description: "Pocket Inventory - simple offline-first inventory for everyday stores."
publish_to: 'none'

version: 1.0.5+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  google_fonts: ^6.3.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  intl: ^0.18.0
  flutter_slidable: ^4.0.0
  animate_do: ^3.0.2
  lucide_icons:
    path: packages/lucide_icons_compat
  file_picker: ^10.2.0
  flutter_secure_storage: ^9.2.4
  permission_handler: ^12.0.0+1
  flutter_phoenix: ^1.1.1
  supabase_flutter: ^2.9.1
  mobile_scanner: ^7.0.1
  package_info_plus: ^8.3.0
  vibration: ^3.1.3
  flutter_image_compress: ^2.4.0
  dio: ^5.8.0+1
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  startapp_sdk: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icon/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
