name: Flutter CI

on:
  push:
    branches:
      - productionv3
  pull_request:
    branches:
      - productionv3
      - refactor/sqlite-provider-ci

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Clean build workspace
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Package versioned APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          version_name="${version%%+*}"
          build_number="${version##*+}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Pocket-Inventory-${version_name}-build${build_number}.apk"
          echo "APK_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Inventory-${{ env.APK_VERSION }}-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
