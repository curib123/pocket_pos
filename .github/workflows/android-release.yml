name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-apk
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          version_name="${version%%+*}"
          build_number="${version##*+}"
          apk="BantayStock-${version_name}-build${build_number}.apk"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "release/$apk"
          "$build_tools/aapt" dump badging "release/$apk" | sed -n '1,5p'
          (cd release && sha256sum "$apk" > "$apk.sha256")
          printf 'tag=v%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'name=BantayStock %s\n' "$version_name" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BantayStock-Android-Release
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch release APK offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/verify-android-release.sh

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: release/*
          body: |
            Installable Android release APK for BantayStock (formerly Pocket POS).

            Includes the current inventory interface, SQLite storage, and backup/restore.
            Supports ARM64, ARMv7, and x86_64 devices in one APK.

            This direct-install build uses the repository's default debug signing key
            when no release keystore is configured. It is not a Play Store upload.

            The workflow runs static analysis, inventory tests, release compilation,
            APK signature verification, an offline Android startup check, and
            generates a SHA-256 checksum. Inter fonts are bundled for offline use.
